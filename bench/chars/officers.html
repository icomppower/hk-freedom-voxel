<!doctype html>
<html><head><meta charset="utf-8"><title>Officer lineup</title>
<script type="importmap">{ "imports": { "three": "../../vendor/three/three.module.js", "three/addons/": "../../vendor/three/addons/" } }</script>
<style>html,body{margin:0;background:#2a2f36;color:#ddd;font:13px system-ui} canvas{display:block}
#lab{position:fixed;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);pointer-events:none}
#lab div{padding:6px 10px;font-weight:600;letter-spacing:.08em;text-shadow:0 1px 2px #000}</style></head>
<body><div id="lab"></div>
<script type="module">
// Officer lineup (critic bench): the real crowd view (src/crowd/view.js) on a stand-in game — four officer models in a row
// (?keys=a,b,c,d, default 速龍 便衣 777 比卡超) with a grunt of ?foe= and an ally of ?ally= (skins) for scale — six views (the crowd material dissolves anything within ≈ 3 m of the
// lens, DW-style, so close-ups are long-lens shots from further out). ?ko=1: every officer KO'd (kneel, broken glaive);
// ?crack=1: officers at 15 % HP (the cracked glaive). window.__ready once drawn.
import * as THREE from 'three';
import { createCrowd, ST, KIND } from '../../src/crowd/crowd.js';
import { createCrowdView } from '../../src/crowd/view.js';
import { createCamSim } from '../../src/camera/camera.js';
import { emit } from '../../src/core/events.js';
import { DIFFS } from '../../src/core/difficulty.js';
import { ground } from '../../src/world/map.js';
const q = new URLSearchParams(location.search), ko = q.has('ko'), crack = q.has('crack');
const FOE = q.get('foe') || 'riot', ALLY = q.get('ally') || 'blackbloc';
const W = innerWidth, H = innerHeight;
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(W, H); r.outputColorSpace = THREE.SRGBColorSpace;
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.15; document.body.prepend(r.domElement); r.setScissorTest(true);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x3a4048);
scene.add(new THREE.HemisphereLight(0xc8d4e8, 0x6a5a48, 1.8));
const sun = new THREE.DirectionalLight(0xffe4c0, 2.6); sun.position.set(3, 6, 8); scene.add(sun);
const Z0 = -130, X = [-3, -1, 1, 3.4], KEYS = (q.get('keys') || 'raptor,plain,stamp,shocker').split(',');
const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 12), new THREE.MeshStandardMaterial({ color: 0x5a5448 }));
floor.rotation.x = -Math.PI / 2; floor.position.set(0, ground(0, Z0) - 0.01, Z0); scene.add(floor);
const game = { frame: 100, diff: DIFFS[1], hero: { x: 0, z: Z0 + 8, y: 0, hp: 400 }, cam: createCamSim() };
game.crowd = createCrowd(game, 6);
const c = game.crowd; c.reset();
const models = {};
game.story = { chapter: { skin: { foe: FOE, ally: ALLY }, OFF: Object.fromEntries(KEYS.map((k) => [k, { model: k }])) }, modelOf: (i) => models[i] || null };
const put = (i, x, type, kind) => { c.st[i] = ko && type ? ST.DEAD : ST.GUARD; c.stT[i] = 0; c.x[i] = x; c.z[i] = Z0; c.y[i] = 0; c.yaw[i] = 0; c.type[i] = type; c.kind[i] = kind;
  c.hpMax[i] = 1000; c.hp[i] = crack ? 150 : ko ? 0 : 1000; c.foe[i] = -1; c.rx[i] = ko && type ? -1.4 : 0; };
KEYS.forEach((k, j) => { const i = c.grunts + j; models[i] = k; put(i, X[j], 1, KIND.OFFICER); });
put(0, -4.6, 0, KIND.SWORD);                    // a grunt of the foe skin
put(c.N, -6.2, 0, KIND.SPEAR);                   // an ally of the ally skin
emit('scenario', {});
const view = createCrowdView(scene, game);
emit('scenario', {});
const cam = new THREE.PerspectiveCamera(30, (W / 3) / (H / 2), 0.05, 80);
const gy = ground(0, Z0), views = [
  ['LINE-UP · FRONT', [0.4, gy + 1.6, Z0 + 12], [0.4, gy + 1.1, Z0]], ['3/4', [7, gy + 2.2, Z0 + 8], [0.8, gy + 1.1, Z0]],
  ['BACK', [0.4, gy + 1.9, Z0 - 11], [0.4, gy + 1.1, Z0]], [KEYS[3] + ' HEAD', [3.4 + 1.6, gy + 2.5, Z0 + 3.4], [3.4, gy + 2.0, Z0 + 0.1]],
  [KEYS[3] + ' SIDE', [3.4 + 5.5, gy + 1.6, Z0 + 0.5], [3.4, gy + 1.3, Z0]], [KEYS.slice(0, 3).join(' · ') + ' HEADS', [-1, gy + 2.3, Z0 + 5.5], [-1, gy + 1.9, Z0]],
];
const lab = document.getElementById('lab');
views.forEach(([n]) => { const d = document.createElement('div'); d.textContent = n + (ko ? ' · KO' : crack ? ' · 15 %' : ''); lab.appendChild(d); });
for (let k = 0; k < 40; k++) { view.update(1 / 30, cam); }
views.forEach(([n, p, t], k) => {
  const x = (k % 3) * W / 3, y = H / 2 - Math.floor(k / 3) * H / 2;
  cam.fov = n.includes('HEAD') ? 11 : 30; cam.updateProjectionMatrix();
  cam.position.set(...p); cam.lookAt(...t); cam.updateMatrixWorld();
  view.update(0.001, cam);
  r.setViewport(x, y, W / 3, H / 2); r.setScissor(x, y, W / 3, H / 2); r.render(scene, cam);
});
window.__ready = true;
</script></body></html>
