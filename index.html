<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>趙雲 — Voxel Musou</title>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<style>
  html, body { margin: 0; height: 100%; background: #1a120d; overflow: hidden; }
  canvas#c { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }

  /* ---- HUD (owned by the hud part). DW8 layout, concept calligraphy. 1rem = 1/72 viewport height (10 px @720p). ---- */
  html { font-size: calc(100vh / 72); }
  :root { --brush: "Xingkai SC", "STXingkai", "HudBrush", serif; --kai: "Kaiti SC", "STKaiti", "KaiTi", "HudBrush", serif;
    --sans: "Avenir Next", "Helvetica Neue", sans-serif; }
  /* Portable brush fallback for machines without the macOS Xingkai/Kaiti assets: Yuji Boku (SIL OFL 1.1, Kinuta Font
     Factory), subset to the HUD's glyphs (src/ui/brush.woff2). Only fetched when the fonts before it are missing.
     When you add HUD text with new CJK characters, re-subset (Google Fonts css2?family=Yuji+Boku&text=...). */
  @font-face { font-family: "HudBrush"; src: url(./src/ui/brush.woff2) format("woff2"); font-display: swap; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #f4ead8; user-select: none; overflow: hidden;
    --gold: #f2c14e; --teal: #3fb8b0; --seal: #b3261e;
    font-family: var(--kai); text-shadow: 0 .2rem .3rem rgba(0,0,0,.7); }
  #hud > * { position: absolute; }
  #hud .seal { display: inline-block; font: 700 1.3rem/1.05 var(--brush); font-style: normal; color: #f8e6d2; background: var(--seal);
    writing-mode: vertical-rl; padding: .3rem .22rem; border-radius: .25rem; text-shadow: none;
    box-shadow: inset 0 0 0 .14rem var(--seal), inset 0 0 0 .24rem rgba(248,230,210,.75), 0 .15rem .4rem rgba(0,0,0,.5); }
  #hud .bar { position: relative; background: rgba(10,7,6,.75); box-shadow: 0 0 0 .1rem rgba(0,0,0,.6), 0 .2rem .5rem rgba(0,0,0,.45); }
  #hud .bar i, #hud .bar em { position: absolute; inset: 0; transform-origin: 0 50%; }
  #hud .bar em { background: #f7efe2; }

  /* intro card: title + controls (concept top-left typography) */
  #hud .h-intro { left: 2.6rem; top: 1.4rem; }
  #hud .h-intro .zh { display: inline-block; font: 700 8rem/1 var(--brush); letter-spacing: .3rem; color: #f7f1e8;
    text-shadow: 0 0 .1rem #000, .3rem .4rem 0 rgba(0,0,0,.5), 0 0 2rem rgba(0,0,0,.4); }
  #hud .h-intro .seal { vertical-align: 1.2rem; margin-left: .6rem; }
  #hud .h-intro .en { font: 500 1.25rem/1 var(--sans); letter-spacing: .95em; margin: .2rem 0 0 .5rem; opacity: .85; }
  #hud .h-intro .sub { font-size: 1.45rem; letter-spacing: .35rem; margin: .9rem 0 0 .4rem; opacity: .85; }
  #hud .h-intro .keys { font: 500 1.15rem/2.2 var(--sans); margin: .9rem 0 0 .2rem; padding: .3rem 1rem; color: #efe3cf;
    background: linear-gradient(90deg, rgba(12,8,6,.62), rgba(12,8,6,0)); border-left: .2rem solid var(--seal); }
  #hud kbd { font: 600 1.05rem/1 var(--sans); padding: .2rem .45rem; border: .1rem solid rgba(239,227,207,.55); border-radius: .3rem;
    background: rgba(0,0,0,.4); margin-right: .15rem; }

  /* player: pixel portrait badge, brush name, long teal HP bar, 3-segment musou gauge (DW8 bottom band) */
  #hud .h-player { left: 0; right: 0; bottom: 0; height: 20rem; }
  #hud .badge { position: absolute; left: 3.4rem; bottom: 4.2rem; width: 11rem; height: 11rem; border-radius: 50%; overflow: hidden;
    background: radial-gradient(circle at 50% 38%, #3c6f72, #16262a 70%); border: .35rem solid #d9d2c6;
    box-shadow: 0 0 0 .2rem #1a1210, 0 0 0 .38rem #b8893a, 0 .4rem 1rem rgba(0,0,0,.6); }
  #hud .badge canvas { position: absolute; left: 1.1rem; bottom: -.3rem; width: 8.8rem; height: 8.8rem; image-rendering: pixelated; }
  #hud .h-player.hurt .badge { border-color: #ff6a4a; }
  #hud .h-player.low .badge { box-shadow: 0 0 0 .2rem #1a1210, 0 0 0 .38rem #d23a24, 0 0 1.6rem rgba(230,60,30,.7); }
  #hud .name { position: absolute; left: 13.4rem; bottom: 7.9rem; font: 700 3.8rem/1 var(--brush); color: #f7f1e8;
    text-shadow: 0 0 .1rem #000, .2rem .3rem 0 rgba(0,0,0,.55); }
  #hud .hp { position: absolute; left: 16%; right: 22%; bottom: 6.8rem; height: 1.4rem;
    clip-path: polygon(0 0, 100% 0, calc(100% - 1rem) 100%, 0 100%);
    background: linear-gradient(rgba(58,46,38,.88), rgba(20,15,12,.88)); }   /* empty track: readable length */
  #hud .hp::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 .12rem rgba(214,184,130,.6); }
  #hud .hp em { opacity: .8; background: repeating-linear-gradient(90deg, rgba(0,0,0,.2) 0 .2rem, transparent .2rem .6rem),
    linear-gradient(#ffe6c0, #d8a060); }                                                  /* damage chunk (lags, then drains) */
  #hud .hp i { background: linear-gradient(#aef3e6 0 18%, #3fc2b4 30%, #1f8a82 85%, #146058); }
  #hud .h-player.low .hp i { background: linear-gradient(#ffb09a 0 18%, #e2402a 30%, #9a1c10 85%); }
  #hud .mu { position: absolute; left: 15%; width: 30%; bottom: 4.7rem; height: 1.3rem; display: flex; gap: .4rem; --p: 0; }
  #hud .mu div { position: relative; flex: 1; background: rgba(10,7,6,.75); box-shadow: 0 0 0 .1rem #6b4a1c, 0 0 0 .2rem rgba(0,0,0,.6);
    transform: skewX(-24deg); }
  #hud .mu i { position: absolute; inset: .15rem; transform-origin: 0 50%;
    background: repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 .2rem, transparent .2rem .6rem), linear-gradient(#fff2b8, #f2c14e 45%, #b8791c); }
  #hud .mu span { position: absolute; left: calc(100% + 1.2rem); top: -1.1rem; white-space: nowrap; font: 700 2.4rem/1 var(--brush); color: #8a7658; }
  #hud .mu.full div { box-shadow: 0 0 0 .1rem #ffe8a0, 0 0 calc(.6rem + var(--p) * 1.4rem) rgba(255,200,80,.95); }
  #hud .mu.full i { background: linear-gradient(100deg, transparent calc(var(--s, -50%) - 18%), rgba(255,255,240,.9) var(--s, -50%), transparent calc(var(--s, -50%) + 18%)),
    repeating-linear-gradient(90deg, rgba(0,0,0,.14) 0 .2rem, transparent .2rem .6rem), linear-gradient(#fffbe0, #ffd45e 45%, #d08a1c); }
  #hud .mu.full span { color: #ffe3a0; text-shadow: 0 0 calc(.4rem + var(--p) * 1.2rem) #ffb030, .2rem .3rem 0 rgba(0,0,0,.6); }
  #hud .mu.active i { background: linear-gradient(#ffffff, #bfe8ff 45%, #4aa2ff); }
  #hud .mu.active span { color: #d8f2ff; text-shadow: 0 0 1rem #58b2ff; }

  /* Heavy numerals (KO, chain, milestone): DW8's weight in brush calligraphy. <b class="dig" data-t="N"><span>N</span></b>:
     ::before is a dark rim + halo (thick stroke, drop shadows) so digits read over white musou flashes and dark crowds;
     the span is a bevelled vertical gradient, fattened by an edge stroke in the mid tone. */
  #hud .dig { position: relative; isolation: isolate; padding: 0 .12em; --rw: .6rem; --ew: .16rem;
    --hi: #fffbe0; --mid: #ffd865; --lo: #b8680e; --rim: #2a1204; --edge: #f2b440; }
  #hud .dig::before { content: attr(data-t); position: absolute; left: 0; top: 0; padding: inherit; z-index: -1; text-shadow: none;
    color: var(--rim); -webkit-text-stroke: var(--rw) var(--rim); filter: drop-shadow(0 0 .7rem rgba(0,0,0,.65)) drop-shadow(.3rem .4rem 0 rgba(0,0,0,.5)); }
  #hud .dig span { text-shadow: none; color: transparent; -webkit-text-stroke: var(--ew) var(--edge);
    background: linear-gradient(var(--hi), var(--mid) 40%, color-mix(in srgb, var(--mid), var(--lo)) 62%, var(--lo));
    -webkit-background-clip: text; background-clip: text; }

  /* counters: KO bottom right (gold), chain left (ice cyan) — brush numerals, ghost layer <u> */
  #hud .num { position: relative; display: inline-block; }
  #hud .num b, #hud .num u { display: inline-block; font: 700 6.6rem/1 var(--brush); text-decoration: none; }
  #hud .num u { position: absolute; right: 0; top: 0; opacity: 0; }
  #hud .h-ko { right: 6.5%; bottom: 5.4rem; text-align: right; }
  #hud .h-ko b { transform-origin: 100% 85%; }
  #hud .h-ko u { color: #ffd66a; transform-origin: 100% 85%; padding: 0 .12em; text-shadow: 0 0 1.4rem rgba(255,190,60,.9); }
  #hud small { display: block; font: 700 1.15rem/1 var(--sans); letter-spacing: .3em; text-shadow: 0 0 .3rem #000, 0 .15rem .3rem rgba(0,0,0,.8); }
  #hud small em { font: 700 1.9rem/1 var(--brush); font-style: normal; letter-spacing: .1em; margin-right: .5rem; vertical-align: -.3rem; }
  #hud .h-ko small { color: #ffe0a0; margin-top: -.4rem; }
  #hud .h-chain { left: 11%; top: 45%; }
  #hud .h-chain b { transform-origin: 0 85%; --hi: #f4feff; --mid: #9aeaff; --lo: #1d78c0; --rim: #041a2e; --edge: #5cc8f4; }
  /* chain ghosts (pool of 3, one per tick): pale cyan digit with a DW8 motion smear trailing up-right, where it came from */
  #hud .h-chain u { transform-origin: 0 100%; color: #f4feff; -webkit-text-stroke: .22rem #3aa6f0; padding: 0 .12em;
    text-shadow: .12em -.1em 0 rgba(130,220,255,.55), .24em -.2em 0 rgba(110,205,255,.3), .36em -.3em .1rem rgba(90,190,255,.14),
      0 0 1.2rem rgba(90,200,255,.9); }
  #hud .h-chain small { color: #bfeeff; margin: -.3rem 0 0 .3rem; }

  /* KO milestone: centre, heavy gold brush number (digits ~13 % H like DW8) + red 擊破 seal stamp */
  #hud .h-mile { left: 0; right: 0; top: 33%; text-align: center; opacity: 0; }
  #hud .h-mile b { display: inline-block; font: 700 15rem/1 var(--brush); --rw: 1rem; --ew: .3rem; --hi: #fffdf0; --mid: #ffdc6a;
    vertical-align: middle; }
  #hud .h-mile b::before { filter: drop-shadow(0 0 1.4rem rgba(0,0,0,.8)) drop-shadow(.5rem .6rem 0 rgba(0,0,0,.5)); }
  #hud .h-mile .seal { font-size: 3.3rem; padding: .6rem .45rem; vertical-align: middle; margin-left: .2rem; }

  /* system banner: full-width band y 64-71 %; dialogue: portrait + 2 lines, lower left */
  #hud .h-band { left: 0; right: 0; top: 64%; padding: .6rem 0 .7rem; text-align: center; opacity: 0;
    background: linear-gradient(90deg, rgba(10,6,4,0), rgba(10,6,4,.72) 22%, rgba(10,6,4,.72) 78%, rgba(10,6,4,0));
    border-image: linear-gradient(90deg, transparent, rgba(214,170,90,.8) 30%, rgba(214,170,90,.8) 70%, transparent) 1; border-width: .1rem 0; border-style: solid; }
  #hud .h-band p { margin: 0; font: 700 2.6rem/1.15 var(--kai); letter-spacing: .4rem; }
  #hud .h-band p em { font-style: normal; color: #ff5b3c; }
  #hud .h-band small { margin-top: .35rem; opacity: .8; font-weight: 500; }
  #hud .h-dlg { left: 2.6rem; top: 9.6rem; display: flex; gap: 1.2rem; align-items: center; opacity: 0; padding: .6rem 6rem .6rem 1rem;
    background: linear-gradient(90deg, rgba(10,6,4,.8), rgba(10,6,4,.6) 65%, rgba(10,6,4,0)); border-left: .25rem solid var(--teal); }
  #hud .h-dlg canvas { width: 5.6rem; height: 5.6rem; image-rendering: pixelated; background: #1d3a3c; box-shadow: 0 0 0 .15rem #d9d2c6; }
  #hud .h-dlg b { font: 700 2rem/1 var(--brush); color: #9fe6de; }
  #hud .h-dlg b span { font: 600 .95rem/1 var(--sans); letter-spacing: .3em; color: #9fe6de; opacity: .8; margin-left: .5rem; }
  #hud .h-dlg p { margin: .4rem 0 .35rem; font: 700 2.3rem/1.1 var(--kai); letter-spacing: .12rem; white-space: nowrap; }
  #hud .h-dlg small { font-weight: 600; letter-spacing: .06em; font-size: 1.6rem; white-space: nowrap; color: #f4ead8; }

  /* musou: concept's vertical copy on the right */
  #hud .h-copy { right: 3.2%; top: 44%; writing-mode: vertical-rl; font: 700 3.4rem/1.3 var(--brush); letter-spacing: .5rem; opacity: 0;
    color: #f7f1e8; text-shadow: 0 0 .1rem #000, .2rem .3rem 0 rgba(0,0,0,.55), 0 0 1.4rem rgba(120,200,255,.5);
    border-top: .15rem solid rgba(247,241,232,.7); border-bottom: .15rem solid rgba(247,241,232,.7); padding: 1rem 0; }

  /* officer target bar (top left) + floating officer tags */
  #hud .h-target { left: 2.6rem; top: 2.2rem; width: 36%; opacity: 0; }
  /* objective line (story lane: dialogue/objective parts) */
  #hud .h-obj { left: 2.6rem; top: .5rem; opacity: 0; font: 700 1.5rem/1 var(--kai); color: #f4ead8; white-space: nowrap; }
  #hud .h-obj i { font-style: normal; color: var(--gold); margin-right: .5rem; }
  #hud .h-obj small { font: 600 1rem/1 var(--sans); letter-spacing: .15em; margin-left: .8rem; opacity: .75; }
  #hud .h-target .seal { font-size: 1.6rem; vertical-align: .6rem; margin-right: .6rem; writing-mode: horizontal-tb; padding: .25rem .3rem; }
  #hud .h-target b { font: 700 2.8rem/1 var(--brush); color: #ffe3b0; }
  #hud .h-target span { font: 600 1rem/1 var(--sans); letter-spacing: .35em; margin-left: .8rem; opacity: .85; }
  #hud .h-target .bar { height: 1rem; margin-top: .5rem; clip-path: polygon(0 0, 100% 0, calc(100% - .7rem) 100%, 0 100%); }
  #hud .h-target .bar i { background: linear-gradient(#ffb49a 0 20%, #e0442e 35%, #8e1c10); }
  #hud .h-target .bar em { background: #ffcf8a; }
  #hud .h-target strong { position: absolute; left: 14rem; top: -.6rem; font: 700 4rem/1 var(--brush); color: #ff5b3c; opacity: 0;
    transform: rotate(-8deg); -webkit-text-stroke: .1rem #3a0a04; }
  #hud .h-target.ko strong { opacity: 1; }
  #hud .h-offs { inset: 0; }
  #hud .off { position: absolute; left: 0; top: 0; width: 0; height: 0; opacity: 0; }
  /* anchor = the ▼▼ tip on the officer's head; .bd (name, romanisation, HP bar ~16 % W) is a 0×0 box at the anchor,
     moved/scaled from JS; .ld is the 1 px leader drawn when the body had to leave the ▼▼ */
  #hud .off .bd { position: absolute; left: 0; bottom: 0; width: 0; height: 0; }
  #hud .off b, #hud .off span, #hud .off .bar { position: absolute; left: -11rem; width: 22rem; text-align: center; }
  #hud .off b { bottom: 2.75rem; font: 700 2.5rem/1 var(--brush); color: #ffd9a8; }
  #hud .off span { bottom: 1.3rem; font: 700 1.3rem/1 var(--sans); letter-spacing: .24em; color: #f6e6d2; }
  #hud .off .bar { bottom: .2rem; left: -10.5rem; width: 21rem; height: .8rem; clip-path: polygon(0 0, 100% 0, calc(100% - .5rem) 100%, 0 100%); }
  #hud .off .bar i { background: linear-gradient(#ffb49a 0 20%, #e0442e 35%, #8e1c10); }
  #hud .off .mk { position: absolute; left: 0; bottom: 0; transform-origin: 50% 100%; font: 700 1.6rem/1 var(--sans); color: #ff4a2e;
    letter-spacing: -.2rem; white-space: nowrap; text-shadow: 0 0 .2rem #000, 0 .1rem .2rem rgba(0,0,0,.8); }
  #hud .off .ld { position: absolute; left: -.07rem; bottom: 0; width: .14rem; height: 1px; transform-origin: 50% 100%;
    background: rgba(255,217,168,.75); box-shadow: 0 0 .15rem rgba(0,0,0,.8); }

  /* minimap: square battlefield map + 蜀/魏 morale bar (top right) */
  #hud .h-map { right: 2.4%; top: 4.2rem; width: 20rem; }
  #hud .h-map canvas { display: block; width: 20rem; height: 20rem; box-shadow: 0 0 0 .1rem rgba(214,184,130,.75), 0 0 0 .25rem rgba(0,0,0,.45), 0 .4rem 1rem rgba(0,0,0,.4); }
  #hud .morale { position: relative; height: .5rem; margin: 0 0 .7rem; background: #c0392b; box-shadow: 0 0 0 .1rem rgba(0,0,0,.6); }
  #hud .morale i { position: absolute; inset: 0; background: linear-gradient(#8fc4ff, #2f6fd0); transform-origin: 0 50%; }
  #hud .morale span { position: absolute; top: -.6rem; font: 700 1.5rem/1 var(--brush); }
  #hud .morale span:first-of-type { left: -2rem; color: #9cc8ff; }
  #hud .morale span:last-of-type { right: -2rem; color: #ff8a70; }
  #hud .h-map .seal { position: absolute; left: .5rem; bottom: .5rem; font-size: 1.05rem; padding: .2rem .15rem; opacity: .9; }
  /* start / pause menu: the sim waits behind it (Esc reopens it) */
  #menu { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; justify-content: center; padding: 0 0 0 9vw;
    color: #f4ead8; font-family: var(--kai); user-select: none;
    background: linear-gradient(90deg, rgba(12,8,6,.92) 0, rgba(12,8,6,.78) 40%, rgba(12,8,6,.15) 75%, rgba(12,8,6,0)); }
  #menu[hidden] { display: none; }
  #menu .t { font: 700 16rem/1 var(--brush); letter-spacing: 1rem; color: #f7f1e8;
    text-shadow: .4rem .5rem 0 rgba(0,0,0,.55), 0 0 3rem rgba(0,0,0,.5); }
  #menu .t i { display: inline-block; vertical-align: 3rem; margin-left: 1.2rem; font: 700 2.4rem/1.05 var(--brush);
    font-style: normal; writing-mode: vertical-rl; padding: .5rem .35rem; border-radius: .3rem; color: #f8e6d2; background: #b3261e; letter-spacing: 0;
    text-shadow: none; box-shadow: inset 0 0 0 .2rem #b3261e, inset 0 0 0 .35rem rgba(248,230,210,.75); }
  #menu .en { font: 500 1.8rem/1 var(--sans); letter-spacing: 1.1em; margin: .6rem 0 0 .6rem; opacity: .85; }
  #menu .sub { font-size: 2.2rem; letter-spacing: .5rem; margin: 2rem 0 0 .4rem; color: #e8d9bf; }
  #menu table { align-self: flex-start; margin: 3rem 0 0 .2rem; border-collapse: collapse; font: 500 1.7rem/1 var(--sans);
    border-left: .3rem solid #b3261e; background: linear-gradient(90deg, rgba(0,0,0,.35), rgba(0,0,0,0)); }
  #menu td { padding: .75rem 1.6rem; white-space: nowrap; }
  #menu td:first-child { font: 700 2.2rem/1 var(--kai); color: #f2c14e; }
  #menu td:first-child small { font: 500 1.3rem/1 var(--sans); letter-spacing: .15em; color: #cdbb9c; margin-left: .8rem; }
  #menu kbd { font: 600 1.5rem/1 var(--sans); padding: .3rem .6rem; margin-right: .3rem;
    border: .12rem solid rgba(239,227,207,.6); border-radius: .4rem; background: rgba(0,0,0,.45); }
  #menu button { align-self: flex-start; margin: 3.4rem 0 0 .2rem; padding: 1.2rem 4rem; cursor: pointer; border: 0; border-radius: .4rem;
    font: 700 3rem/1 var(--brush); letter-spacing: .6rem; color: #1a120d;
    background: linear-gradient(#ffe7a3, #f2c14e 55%, #c98a22); box-shadow: 0 0 0 .15rem #5a3a10, 0 .5rem 1.6rem rgba(0,0,0,.5); }
  #menu button:hover { filter: brightness(1.1); }
  #menu button small { font: 600 1.4rem/1 var(--sans); letter-spacing: .3em; margin-left: 1rem; }
  #menu .hint { margin: 1.4rem 0 0 .4rem; font: 500 1.35rem/1.5 var(--sans); letter-spacing: .08em; opacity: .7; }
  #menu #quit { margin-top: 1.2rem; padding: .8rem 2.6rem; font-size: 2rem; color: #f4ead8; background: rgba(0,0,0,.45);
    box-shadow: 0 0 0 .15rem rgba(239,227,207,.5); }

  /* ---- flow screens (main.js): one fixed full-screen layer each, shown one at a time. Placeholder look (.scr-box);
     ui lane: #title #select · story lane: #prologue #result — each lane styles its own screen below its own marker. */
  .scr { position: fixed; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center;
    color: #f4ead8; font-family: var(--kai); user-select: none; background: rgba(12,8,6,.82); }
  .scr[hidden] { display: none; }
  .scr-box { display: flex; flex-direction: column; align-items: center; gap: 1.6rem; text-align: center; }
  .scr-box h1 { margin: 0; font: 700 12rem/1 var(--brush); }
  .scr-box h2 { margin: 0; font: 700 5rem/1 var(--brush); }
  .scr-box p { margin: 0; font-size: 2rem; line-height: 1.6; }
  .scr-box small { font: 600 1.3rem/1 var(--sans); letter-spacing: .2em; margin-left: .6rem; opacity: .8; }
  .scr-box button { min-width: 32rem; padding: 1rem 3rem; cursor: pointer; border: 0; border-radius: .4rem; font: 700 2.6rem/1 var(--brush);
    color: #1a120d; background: linear-gradient(#ffe7a3, #f2c14e 55%, #c98a22); }
  /* ui lane: #title / #select styles (+ #ink wipe, .ui-foot prompts, .ui-stamp seal, #menu look). Ink-wash + lacquer +
     gold leaf in the HUD's language: brush calligraphy (--brush / --kai), red seals, gold-leaf gradients; 1rem = 1/72 vh. */
  :root { --leaf: linear-gradient(#fffbe0, #ffd865 42%, #d69a2c 64%, #9a5a10); --paper: #f4ead8; --dim: #b9a888; --sealr: #b3261e; --shu: #2c6a48; }
  #title:not([hidden]), #select:not([hidden]) { display: block; background: none; overflow: hidden; }
  #title button, #select button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  #title button:focus-visible, #select button:focus-visible { outline: .15rem solid rgba(242,193,78,.7); outline-offset: .3rem; }
  .t-veil, .s-veil { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 78% 45%, transparent 40%, rgba(8,5,4,.55)),
      linear-gradient(90deg, rgba(12,8,6,.9) 0, rgba(12,8,6,.72) 28%, rgba(12,8,6,.18) 55%, transparent 70%),
      linear-gradient(transparent 72%, rgba(8,5,4,.85)); }
  #title kbd, #select kbd { display: inline-block; font: 600 1.2rem/1 var(--sans); padding: .3rem .5rem; margin-right: .3rem; min-width: 1rem;
    text-align: center; border: .12rem solid rgba(239,227,207,.55); border-radius: .35rem; background: rgba(0,0,0,.4); color: var(--paper); }
  #title kbd.pad, #select kbd.pad { border-radius: 50%; min-width: 0; width: 1.2rem; padding: .3rem; color: #1a120d; background: #e9dcc2; border-color: #e9dcc2; }

  /* prompts strip along the bottom (console-style button legend) */
  .ui-foot { position: absolute; left: 7rem; right: 6rem; bottom: 2.6rem; display: flex; justify-content: flex-end; gap: 3.2rem;
    padding-top: 1.1rem; font: 700 1.7rem/1 var(--kai); color: var(--paper);
    border-top: .1rem solid; border-image: linear-gradient(90deg, transparent, rgba(214,170,90,.7) 40%, rgba(214,170,90,.7)) 1; }
  .ui-foot small { font: 600 1.05rem/1 var(--sans); letter-spacing: .12em; margin-left: .5rem; opacity: .6; }
  /* red seal slammed on a confirm (menu.js stamp) */
  .ui-stamp { position: absolute; z-index: 2; pointer-events: none; font: 700 3rem/1.05 var(--brush); font-style: normal; color: #fbe9d6;
    background: var(--sealr); writing-mode: vertical-rl; white-space: nowrap; padding: .45rem .35rem; border-radius: .35rem; letter-spacing: 0; text-shadow: none;
    box-shadow: inset 0 0 0 .2rem var(--sealr), inset 0 0 0 .34rem rgba(251,233,214,.8), 0 .3rem 1rem rgba(0,0,0,.55); }
  /* ink wipe layer (menu.js inkWipe): ragged dry-brush edges via an SVG mask set from JS */
  #ink { position: fixed; top: 0; left: 0; width: 230vw; height: 100vh; z-index: 10; pointer-events: none; will-change: transform;
    background: repeating-linear-gradient(177deg, rgba(255,240,210,.02) 0 .2rem, transparent .2rem 1.1rem), linear-gradient(#17100c, #0c0806 55%, #17100c);
    -webkit-mask-size: 100% 100%; mask-size: 100% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; transform: translateX(100vw); }
  #ink[hidden] { display: none; }
  .swash { position: absolute; pointer-events: none; fill: #d9a53a; filter: drop-shadow(0 0 .6rem rgba(242,193,78,.45));
    clip-path: inset(0 100% 0 0); transition: clip-path .38s cubic-bezier(.5,0,.2,1); }
  @keyframes fadeIn { from { opacity: 0; } }

  /* ---- title: live field behind, logo top-left, menu in the ink band */
  .t-logo { position: absolute; left: 7rem; top: 5.5rem; }
  .t-logo h1 { position: relative; isolation: isolate; margin: 0 0 0 5.4rem; font: 700 22rem/1 var(--brush); letter-spacing: -.4rem; }
  .t-logo h1::before { content: attr(data-t); position: absolute; left: 0; top: 0; z-index: -1; color: #1a0c04;
    -webkit-text-stroke: 1.3rem #1a0c04; filter: drop-shadow(0 0 1.6rem rgba(0,0,0,.7)) drop-shadow(.6rem .8rem 0 rgba(0,0,0,.45)); }
  .t-logo h1 span { color: transparent; background: var(--leaf); -webkit-background-clip: text; background-clip: text; -webkit-text-stroke: .28rem #f2b440; }
  .t-seal { position: absolute; left: 0; top: 2.4rem; z-index: 1; font: 700 3.6rem/1.02 var(--brush); font-style: normal; color: #fbe9d6;
    background: var(--sealr); writing-mode: vertical-rl; padding: .7rem .5rem; border-radius: .4rem; transform: rotate(-5deg);
    box-shadow: inset 0 0 0 .24rem var(--sealr), inset 0 0 0 .42rem rgba(251,233,214,.8), 0 .4rem 1.2rem rgba(0,0,0,.6); }
  .t-en { display: flex; align-items: center; gap: 1.6rem; margin: .4rem 0 0 6rem; font: 600 1.9rem/1 var(--sans); letter-spacing: 1.15em;
    color: #efe0bf; text-shadow: 0 .2rem .5rem rgba(0,0,0,.8); }
  .t-en::after { content: ""; width: 12rem; height: .12rem; background: linear-gradient(90deg, rgba(242,193,78,.9), transparent); }
  #title.in .t-logo h1 { animation: inkIn 1.1s cubic-bezier(.3,0,.2,1) both; }
  #title.in .t-seal { animation: sealIn .32s cubic-bezier(.3,0,.6,1) .75s both; }
  #title.in .t-en { animation: fadeIn .8s ease 1s both; }
  @keyframes inkIn { from { clip-path: inset(0 100% 0 0); filter: blur(.8rem); opacity: .2; } 60% { filter: blur(0); opacity: 1; } to { clip-path: inset(-20% -10% -20% -5%); } }
  @keyframes sealIn { from { transform: scale(2.4) rotate(3deg); opacity: 0; } 60% { transform: scale(.92) rotate(-6deg); opacity: 1; } to { transform: rotate(-5deg); } }

  .t-press { position: absolute; left: 8rem; top: 45rem; color: var(--paper); opacity: 0; pointer-events: none; transition: opacity .3s; }
  .t-press b { display: block; font: 700 3.4rem/1 var(--brush); letter-spacing: .6rem; }
  .t-press small { display: block; margin-top: .8rem; font: 600 1.3rem/1 var(--sans); letter-spacing: .5em; opacity: .7; }
  #title.pre .t-press { opacity: 1; animation: breathe 2.2s ease-in-out 1.2s infinite; }
  @keyframes breathe { 50% { opacity: .35; } }

  .t-menu { position: absolute; left: 7rem; top: 39rem; display: flex; flex-direction: column; gap: .6rem; transition: opacity .3s; }
  #title .t-menu button { position: relative; isolation: isolate; display: block; padding: .7rem 0 1.5rem 4rem; color: rgba(244,234,216,.5);
    transition: color .2s, transform .25s cubic-bezier(.3,0,.2,1), opacity .4s; }
  .t-menu b { display: block; font: 700 4.4rem/1 var(--brush); letter-spacing: .3rem; text-shadow: 0 .3rem .6rem rgba(0,0,0,.7); }
  .t-menu small { display: block; margin-top: .5rem; font: 600 1.2rem/1 var(--sans); letter-spacing: .14em; opacity: .75; }
  .t-menu .swash { left: 3rem; bottom: 2.7rem; width: 30rem; height: 1.8rem; z-index: -1; }
  .t-menu button::before { content: ""; position: absolute; left: .6rem; top: 2.3rem; width: 1.1rem; height: 1.1rem; background: var(--sealr);
    box-shadow: 0 0 0 .15rem rgba(251,233,214,.7), 0 0 .8rem rgba(179,38,30,.8); transform: rotate(45deg) scale(0); transition: transform .25s; }
  #title .t-menu button.on { color: #fff6e0; transform: translateX(1.2rem); }
  .t-menu button.on b { text-shadow: 0 0 1.4rem rgba(255,200,90,.45), .2rem .3rem 0 rgba(0,0,0,.6); }
  .t-menu button.on::before { transform: rotate(45deg) scale(1); }
  .t-menu button.on .swash { clip-path: inset(0 0 0 0); }
  .t-menu .ui-stamp { left: 36rem; top: .2rem; }
  #title.pre .t-menu button { opacity: 0; transform: translateX(-3rem); pointer-events: none; }
  .t-menu button:nth-child(2) { transition-delay: 0s, 0s, .07s; } .t-menu button:nth-child(3) { transition-delay: 0s, 0s, .14s; }
  #title.ctl .t-menu { opacity: .3; }
  #title .ui-foot { transition: opacity .4s; } #title.pre .ui-foot { opacity: 0; }

  .t-ctl { position: absolute; right: 6rem; top: 50%; transform: translate(3rem, -50%); opacity: 0; pointer-events: none; padding: 2.4rem 3rem 2rem;
    background: linear-gradient(135deg, rgba(20,13,10,.93), rgba(14,9,7,.88)); border-left: .35rem solid var(--sealr);
    box-shadow: 0 0 0 .1rem rgba(214,170,90,.45), 0 1.5rem 4rem rgba(0,0,0,.6); transition: opacity .3s, transform .35s cubic-bezier(.3,0,.2,1); }
  #title.ctl .t-ctl { opacity: 1; transform: translate(0, -50%); pointer-events: auto; }
  .t-ctl h2 { margin: 0 0 1.4rem; font: 700 3.6rem/1 var(--brush); color: var(--paper); letter-spacing: .3rem; }
  .t-ctl h2 small, .t-ctl th small { font: 600 1.15rem/1 var(--sans); letter-spacing: .14em; margin-left: .9rem; color: var(--dim); }
  .t-ctl table { border-collapse: collapse; font: 500 1.55rem/1 var(--sans); color: #efe3cf; }
  .t-ctl tr + tr { border-top: .1rem solid rgba(214,170,90,.16); }
  .t-ctl th { padding: .8rem 2.4rem .8rem 0; text-align: left; white-space: nowrap; font: 700 2.1rem/1 var(--kai); color: #f2c14e; }
  .t-ctl td { padding: .8rem 1.6rem .8rem 0; white-space: nowrap; }
  .t-ctl td.pad { color: var(--dim); }
  .t-ctl p { margin: 1.6rem 0 0; max-width: 52rem; font: 500 1.3rem/1.5 var(--sans); color: var(--dim); }

  /* ---- select: live officer on the right, roster + info in the ink band */
  #select { --acc: #3fb8b0; }
  .s-veil { background: radial-gradient(90% 80% at 70% 50%, transparent 45%, rgba(8,5,4,.6)),
    linear-gradient(90deg, rgba(12,8,6,.92) 0, rgba(12,8,6,.8) 30%, rgba(12,8,6,.35) 50%, transparent 62%),
    linear-gradient(rgba(8,5,4,.7), transparent 16%, transparent 76%, rgba(8,5,4,.9)); }
  .s-head { position: absolute; left: 7rem; top: 3.4rem; display: flex; align-items: baseline; gap: 1.2rem; color: var(--paper); }
  .s-head h2 { margin: 0; font: 700 4.6rem/1 var(--brush); letter-spacing: .4rem; text-shadow: .2rem .3rem 0 rgba(0,0,0,.55); }
  .s-head > small { font: 600 1.25rem/1 var(--sans); letter-spacing: .16em; color: var(--dim); }
  .s-mode { align-self: center; margin-left: 2rem; padding: .55rem 2.8rem .55rem 1.2rem; font: 700 1.9rem/1 var(--kai); color: #ffe3a0;
    background: linear-gradient(90deg, #8e1a14, #5a0f0b); clip-path: polygon(0 0, 100% 0, calc(100% - 1rem) 50%, 100% 100%, 0 100%);
    box-shadow: inset .3rem 0 0 #f2c14e; }
  .s-mode small { font: 600 1.05rem/1 var(--sans); letter-spacing: .12em; margin-left: .7rem; color: #f4d8b8; opacity: .8; }

  .s-roster { position: absolute; left: 7rem; top: 12rem; width: 17rem; display: flex; flex-direction: column; gap: 1.2rem; }
  .s-fac { display: flex; align-items: center; gap: 1rem; margin-bottom: .4rem; color: var(--paper); }
  .s-fac i { font: 700 3rem/1 var(--brush); font-style: normal; color: #ffe3a0; padding: .7rem .8rem 1.5rem;
    background: linear-gradient(#3a8a60, var(--shu) 60%, #174a30); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%);
    box-shadow: inset 0 .3rem 0 #f2c14e; text-shadow: 0 .15rem .3rem rgba(0,0,0,.6); }
  .s-fac small { font: 600 1.15rem/1 var(--sans); letter-spacing: .2em; color: var(--dim); }
  #select .s-card { position: relative; display: grid; grid-template-columns: 6.4rem 1fr; column-gap: 1.2rem; align-content: end;
    padding: .8rem; color: rgba(244,234,216,.55); background: linear-gradient(90deg, rgba(30,20,15,.85), rgba(20,13,10,.55));
    box-shadow: 0 0 0 .1rem rgba(214,170,90,.2); transition: transform .25s cubic-bezier(.3,0,.2,1), box-shadow .25s, color .2s; }
  .s-card canvas { grid-row: 1 / 3; width: 6.4rem; height: 6.4rem; image-rendering: pixelated;
    background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--acc) 55%, #222), #120c0a 75%); filter: saturate(.4) brightness(.7); transition: filter .25s; }
  .s-card b { align-self: end; font: 700 3rem/1 var(--brush); white-space: nowrap; }
  .s-card small { font: 600 1.05rem/1.2 var(--sans); letter-spacing: .12em; padding-top: .4rem; opacity: .75; }
  .s-card em { position: absolute; right: .5rem; top: .5rem; font: 700 1.1rem/1 var(--kai); font-style: normal; color: #fbe9d6;
    background: var(--sealr); padding: .2rem .35rem; border-radius: .2rem; }
  #select .s-card.on { color: #fff6e0; transform: translateX(1.4rem);
    box-shadow: 0 0 0 .14rem #f2c14e, 0 0 1.6rem color-mix(in srgb, var(--acc) 60%, transparent), inset .4rem 0 0 var(--acc); }
  .s-card.on canvas { filter: none; }

  .s-info { position: absolute; left: 30rem; top: 10.5rem; width: 46rem; color: var(--paper); }
  .s-name { display: flex; align-items: flex-start; gap: 1.4rem; }
  .s-name h1 { margin: 0; font: 700 10rem/1 var(--brush); letter-spacing: .4rem; color: #f9f3e8; white-space: nowrap;
    text-shadow: .3rem .4rem 0 rgba(0,0,0,.55), 0 0 2.4rem color-mix(in srgb, var(--acc) 45%, transparent); }
  .s-name div { display: flex; gap: .7rem; padding-top: 1.2rem; }
  .s-seal { font: 700 2rem/1.05 var(--brush); font-style: normal; color: #fbe9d6; background: var(--sealr); writing-mode: vertical-rl;
    padding: .4rem .3rem; border-radius: .3rem; box-shadow: inset 0 0 0 .16rem var(--sealr), inset 0 0 0 .28rem rgba(251,233,214,.75); }
  .s-court { margin: 0; writing-mode: vertical-rl; font: 700 2.2rem/1 var(--kai); letter-spacing: .3rem; color: #e9d8b6; }
  .s-en { margin: .2rem 0 0 .4rem; font: 600 1.4rem/1 var(--sans); letter-spacing: .3em; color: var(--dim); }
  .s-epi { margin: 1.4rem 0 0; }
  .s-epi b { font: 700 2.5rem/1 var(--kai); letter-spacing: .3rem; color: #f2c14e; }
  .s-epi small, .s-wpn small { font: 600 1.15rem/1 var(--sans); letter-spacing: .1em; margin-left: 1rem; color: var(--dim); }
  .s-wpn { margin: 1.2rem 0 0; display: flex; align-items: center; }
  .s-wpn span { font: 700 1.3rem/1 var(--kai); color: #fbe9d6; background: var(--sealr); padding: .3rem .5rem; margin-right: 1rem; border-radius: .2rem; }
  .s-wpn b { font: 700 2rem/1 var(--kai); }
  .s-bio { margin: 1.3rem 0 0; padding-left: 1.2rem; border-left: .2rem solid color-mix(in srgb, var(--acc) 70%, transparent); }
  .s-bio span { display: block; font: 500 1.75rem/1.35 var(--kai); }
  .s-bio span + span { margin-top: .6rem; }
  .s-bio small { display: block; font: 500 1.15rem/1.35 var(--sans); color: var(--dim); }
  .s-stats { list-style: none; margin: 1.8rem 0 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem 3rem; }
  .s-stats li { display: grid; grid-template-columns: 4.4rem 1fr; align-items: center; row-gap: .15rem; }
  .s-stats b { grid-row: 1 / 3; font: 700 2.4rem/1 var(--brush); color: #ffe3a0; }
  .s-stats small { font: 600 .95rem/1 var(--sans); letter-spacing: .14em; color: var(--dim); }
  .s-stats span { display: flex; gap: .35rem; }
  .s-stats i { flex: 1; height: 1.1rem; transform: skewX(-24deg); background: rgba(10,7,6,.75); box-shadow: 0 0 0 .1rem #6b4a1c; }
  .s-stats i.f { background: linear-gradient(#fff2b8, #f2c14e 45%, #b8791c); box-shadow: 0 0 0 .1rem #ffe8a0, 0 0 .6rem rgba(255,200,80,.5); }
  .s-musou { position: relative; isolation: isolate; margin-top: 2rem; padding: .9rem 1.4rem 1.1rem;
    background: linear-gradient(90deg, rgba(58,13,10,.85), rgba(58,13,10,0)); border-left: .3rem solid #f2c14e; }
  .s-musou span { display: block; font: 700 1.25rem/1 var(--kai); letter-spacing: .4rem; color: #ffb49a; }
  .s-musou b { display: inline-block; margin-top: .5rem; font: 700 3.6rem/1 var(--brush); letter-spacing: .3rem; color: transparent;
    background: var(--leaf); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(.15rem .2rem 0 rgba(0,0,0,.6)); }
  .s-musou small { font: 600 1.15rem/1 var(--sans); letter-spacing: .12em; margin-left: 1.2rem; color: var(--dim); }
  .s-musou .swash { left: 0; bottom: .2rem; width: 32rem; height: 1.6rem; z-index: -1; opacity: .35; clip-path: none; }

  /* intro line: vertical calligraphy right of the officer (the HUD's Musou copy style), brush-revealed top → down */
  .s-line { position: absolute; right: 7rem; top: 11rem; display: flex; flex-direction: row-reverse; gap: 1rem; color: #f9f3e8; }
  .s-line p { margin: 0; writing-mode: vertical-rl; font: 700 3.3rem/1.2 var(--brush); letter-spacing: .5rem; padding: 1.2rem 0; max-height: 44rem;
    border-top: .15rem solid rgba(247,241,232,.7); border-bottom: .15rem solid rgba(247,241,232,.7);
    text-shadow: .2rem .3rem 0 rgba(0,0,0,.55), 0 0 1.4rem color-mix(in srgb, var(--acc) 60%, transparent); }
  .s-line small { writing-mode: vertical-rl; font: 600 1.2rem/1.3 var(--sans); letter-spacing: .08em; color: #e9dcc2; opacity: .75; max-height: 40rem; padding-top: 1.4rem; }

  .s-act { position: absolute; right: 6rem; bottom: 7.6rem; display: flex; align-items: center; gap: 2.4rem; }
  .s-act b { font: 700 2.4rem/1 var(--brush); letter-spacing: .3rem; }
  .s-act small { font: 600 1.1rem/1 var(--sans); letter-spacing: .14em; margin-left: .8rem; opacity: .75; }
  #select .s-back { color: rgba(244,234,216,.65); padding: .9rem 1.6rem; box-shadow: 0 0 0 .12rem rgba(239,227,207,.35); }
  #select .s-back:hover { color: var(--paper); box-shadow: 0 0 0 .12rem rgba(239,227,207,.7); }
  #select .s-go { padding: 1.2rem 3.8rem; color: #1a120d; background: linear-gradient(#ffe7a3, #f2c14e 55%, #c98a22);
    clip-path: polygon(1.2rem 0, 100% 0, calc(100% - 1.2rem) 100%, 0 100%); box-shadow: inset 0 -.3rem 0 rgba(90,58,16,.5); }
  #select .s-go b { font-size: 3.4rem; }
  #select .s-go:hover { filter: brightness(1.1); }
  .s-act .ui-stamp { right: -1rem; bottom: 5.6rem; font-size: 4.4rem; }

  /* focus change: name inks in, stats refill left → right, the intro line is brushed down */
  #select.swap .s-name h1 { animation: nameIn .5s cubic-bezier(.3,0,.2,1) both; }
  #select.swap :is(.s-en, .s-epi, .s-wpn, .s-bio, .s-musou) { animation: fadeIn .45s ease .08s both; }
  #select.swap .s-stats i.f { animation: segIn .3s cubic-bezier(.3,0,.2,1) both; }
  #select.swap .s-stats i:nth-child(2) { animation-delay: .05s; } #select.swap .s-stats i:nth-child(3) { animation-delay: .1s; }
  #select.swap .s-stats i:nth-child(4) { animation-delay: .15s; } #select.swap .s-stats i:nth-child(5) { animation-delay: .2s; }
  #select.swap .s-line p { animation: brushDown 1s cubic-bezier(.4,0,.2,1) .25s both; }
  #select.swap .s-line small { animation: fadeIn .6s ease .9s both; }
  @keyframes nameIn { from { opacity: 0; filter: blur(.7rem); transform: translateX(-1.5rem); letter-spacing: 1.4rem; } }
  @keyframes segIn { from { transform: skewX(-24deg) scaleX(0); } }
  @keyframes brushDown { from { clip-path: inset(0 -50% 100% -50%); } to { clip-path: inset(-5% -50% -5% -50%); } }

  /* pause menu (#menu, battle): ink band + brush name, the title's menu vocabulary */
  #menu .t { font-size: 13rem; }
  #menu .sub { font: 700 2.4rem/1 var(--kai); letter-spacing: .6rem; color: #f2c14e; margin-top: 1.6rem; }
  #menu .sub small { font: 600 1.2rem/1 var(--sans); letter-spacing: .16em; margin-left: 1rem; color: var(--dim); }
  #menu #go, #menu #quit { position: relative; margin: 1rem 0 0 .2rem; padding: .6rem 0 1rem 3rem; border-radius: 0; box-shadow: none; background: none;
    font: 700 4rem/1 var(--brush); letter-spacing: .4rem; color: rgba(244,234,216,.6); text-shadow: 0 .3rem .6rem rgba(0,0,0,.7); filter: none; }
  #menu #go { margin-top: 3.6rem; }
  #menu #go::after, #menu #quit::after { content: ""; position: absolute; left: 2.2rem; right: -4rem; bottom: .3rem; height: .5rem; z-index: -1;
    background: linear-gradient(90deg, #f2c14e, rgba(242,193,78,0)); transform: skewX(-30deg) scaleX(0); transform-origin: 0 50%; transition: transform .3s; }
  #menu #go:hover, #menu #quit:hover, #menu #go:focus-visible, #menu #quit:focus-visible { color: #fff6e0; outline: none; }
  #menu :is(#go, #quit):is(:hover, :focus-visible)::after { transform: skewX(-30deg) scaleX(1); }
  #menu button small { font: 600 1.2rem/1 var(--sans); letter-spacing: .16em; margin-left: 1rem; opacity: .7; }
  #menu .hint { margin-top: 3rem; }

  @media (prefers-reduced-motion: reduce) { #title *, #select * { animation-duration: 1ms !important; transition-duration: 1ms !important; } }
  /* story lane: #prologue / #result styles */
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="menu">
  <div class="t">趙雲<i>常山</i></div>
  <div class="en">VOXEL MUSOU</div>
  <div class="sub">戰局暫停<small>Battle paused</small></div>
  <button id="go">繼續<small>Resume</small></button>
  <button id="quit">撤退<small>Quit to title</small></button>
  <div class="hint">Enter or Esc to resume · the full controls are under 操作說明 on the title screen</div>
</div>
<!-- flow screens (main.js). ui lane: #title #select · story lane: #prologue #result -->
<div id="title" class="scr" hidden></div>
<div id="select" class="scr" hidden></div>
<div id="prologue" class="scr" hidden></div>
<div id="result" class="scr" hidden></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
